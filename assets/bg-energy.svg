<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="28%" cy="18%" r="95%">
      <stop offset="0" stop-color="#0d2142"/>
      <stop offset="50%" stop-color="#071225"/>
      <stop offset="100%" stop-color="#03060e"/>
    </radialGradient>
    <linearGradient id="solar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b6fb0"/>
      <stop offset="1" stop-color="#143a66"/>
    </linearGradient>
    <linearGradient id="solarTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd0ff"/>
      <stop offset="1" stop-color="#2b6fb0"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39e6c3" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39e6c3" stop-opacity="1"/>
      <stop offset="100%" stop-color="#39e6c3" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#2bd6ff" stroke-width="1" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- 光伏阵列 等距网格（左下） -->
  <g transform="translate(120 560)" opacity="0.92">
    <g transform="skewX(-22)">
      <g fill="url(#solar)" stroke="#0c2238" stroke-width="1.5">
        <rect x="0" y="0" width="86" height="46" rx="3"/>
        <rect x="100" y="0" width="86" height="46" rx="3"/>
        <rect x="200" y="0" width="86" height="46" rx="3"/>
        <rect x="50" y="62" width="86" height="46" rx="3"/>
        <rect x="150" y="62" width="86" height="46" rx="3"/>
        <rect x="250" y="62" width="86" height="46" rx="3"/>
        <rect x="0" y="124" width="86" height="46" rx="3"/>
        <rect x="100" y="124" width="86" height="46" rx="3"/>
        <rect x="200" y="124" width="86" height="46" rx="3"/>
      </g>
      <g stroke="#7fe3ff" stroke-opacity="0.5" stroke-width="1">
        <path d="M0 15h336M0 31h336M43 0v170M143 0v170M243 0v170"/>
      </g>
      <g fill="url(#solarTop)" opacity="0.5">
        <rect x="0" y="0" width="86" height="6" rx="2"/>
        <rect x="100" y="0" width="86" height="6" rx="2"/>
        <rect x="200" y="0" width="86" height="6" rx="2"/>
      </g>
    </g>
  </g>

  <!-- 电网节点网络（右上） -->
  <g stroke="#39d6ff" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <path d="M1150 180 L1300 120 L1430 210 L1340 330 L1180 300 Z"/>
    <path d="M1300 120 L1300 60 M1430 210 L1520 250 M1180 300 L1060 360 M1340 330 L1380 440"/>
  </g>
  <g fill="#39e6ff" filter="url(#glow)">
    <circle cx="1150" cy="180" r="6"/>
    <circle cx="1300" cy="120" r="7"/>
    <circle cx="1430" cy="210" r="6"/>
    <circle cx="1340" cy="330" r="6"/>
    <circle cx="1180" cy="300" r="5"/>
    <circle cx="1300" cy="60" r="5"/>
    <circle cx="1520" cy="250" r="5"/>
    <circle cx="1060" cy="360" r="5"/>
    <circle cx="1380" cy="440" r="5"/>
  </g>
  <g fill="#aef3ff" font-family="Consolas,monospace" font-size="13" opacity="0.7">
    <text x="1150" y="205">SPPC</text>
    <text x="1438" y="235">GRID</text>
    <text x="1060" y="385">RTU</text>
  </g>

  <!-- 能量流光线（光伏 -> 储能 -> 电网） -->
  <path id="p1" d="M430 600 C 700 560 950 420 1150 280" fill="none" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path id="p2" d="M430 600 C 600 640 760 600 880 520" fill="none" stroke="#ffb05b" stroke-width="2.5" stroke-opacity="0.55" stroke-linecap="round"/>
  <circle r="5" fill="#aef9ec" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion>
  </circle>
  <circle r="4" fill="#ffd9a8" filter="url(#glow)">
    <animateMotion dur="3.4s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion>
  </circle>

  <!-- 储能单元（中下） -->
  <g transform="translate(820 470)">
    <rect x="0" y="0" width="120" height="80" rx="8" fill="#0e2238" stroke="#39e6c3" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="120" y="26" width="10" height="28" rx="3" fill="#0e2238" stroke="#39e6c3" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="14" y="16" width="92" height="10" rx="3" fill="#39e6c3" opacity="0.85"/>
    <rect x="14" y="34" width="70" height="10" rx="3" fill="#39e6c3" opacity="0.55"/>
    <rect x="14" y="52" width="48" height="10" rx="3" fill="#39e6c3" opacity="0.3"/>
    <text x="60" y="74" fill="#9ffff0" font-family="Consolas,monospace" font-size="11" text-anchor="middle" opacity="0.8">BESS</text>
  </g>

  <!-- 顶部辉光 -->
  <ellipse cx="500" cy="120" rx="420" ry="200" fill="#2b8bff" opacity="0.10"/>
  <ellipse cx="1200" cy="700" rx="380" ry="180" fill="#39e6c3" opacity="0.08"/>
</svg>
