<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="sb" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#0c2138"/>
      <stop offset="100%" stop-color="#040a16"/>
    </radialGradient>
    <linearGradient id="pv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd0ff"/>
      <stop offset="1" stop-color="#1c4f86"/>
    </linearGradient>
    <linearGradient id="fl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39e6c3" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39e6c3" stop-opacity="1"/>
      <stop offset="100%" stop-color="#39e6c3" stop-opacity="0"/>
    </linearGradient>
    <filter id="sg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="sgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2bd6ff" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="600" height="600" fill="url(#sb)"/>
  <rect width="600" height="600" fill="url(#sgrid)"/>

  <!-- 光伏阵列（顶部） -->
  <g transform="translate(150 70) skewX(-20)">
    <g fill="url(#pv)" stroke="#0c2238" stroke-width="1.5">
      <rect x="0" y="0" width="70" height="38" rx="3"/>
      <rect x="84" y="0" width="70" height="38" rx="3"/>
      <rect x="42" y="50" width="70" height="38" rx="3"/>
      <rect x="126" y="50" width="70" height="38" rx="3"/>
    </g>
    <g stroke="#aef3ff" stroke-opacity="0.5"><path d="M0 12h280M0 25h280M35 0v88M119 0v88M203 0v88"/></g>
  </g>
  <text x="300" y="220" fill="#9fe6ff" font-family="Consolas,monospace" font-size="13" text-anchor="middle" opacity="0.8">PV ARRAY</text>

  <!-- 储能 BESS（中部） -->
  <g transform="translate(240 270)">
    <rect x="0" y="0" width="120" height="84" rx="10" fill="#0c2238" stroke="#39e6c3" stroke-opacity="0.7" stroke-width="2.5"/>
    <rect x="120" y="28" width="12" height="28" rx="4" fill="#0c2238" stroke="#39e6c3" stroke-opacity="0.7" stroke-width="2.5"/>
    <rect x="14" y="14" width="92" height="11" rx="4" fill="#39e6c3"/>
    <rect x="14" y="34" width="72" height="11" rx="4" fill="#39e6c3" opacity="0.6"/>
    <rect x="14" y="54" width="50" height="11" rx="4" fill="#39e6c3" opacity="0.32"/>
    <text x="60" y="104" fill="#9ffff0" font-family="Consolas,monospace" font-size="13" text-anchor="middle">BESS</text>
  </g>

  <!-- 电网节点（底部） -->
  <g transform="translate(300 470)">
    <circle r="46" fill="#0c2238" stroke="#39d6ff" stroke-opacity="0.7" stroke-width="2.5"/>
    <path d="M-18 6 L-6 -2 L0 6 L12 -10 L20 6" fill="none" stroke="#39d6ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" filter="url(#sg)"/>
    <text x="0" y="74" fill="#aef3ff" font-family="Consolas,monospace" font-size="13" text-anchor="middle">GRID</text>
  </g>

  <!-- 能量流 -->
  <path id="s1" d="M300 220 C 300 250 300 250 300 268" fill="none" stroke="url(#fl)" stroke-width="3"/>
  <path id="s2" d="M300 354 C 300 410 300 410 300 424" fill="none" stroke="url(#fl)" stroke-width="3"/>
  <circle r="5" fill="#aef9ec" filter="url(#sg)"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#s1"/></animateMotion></circle>
  <circle r="5" fill="#aef9ec" filter="url(#sg)"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#s2"/></animateMotion></circle>

  <ellipse cx="300" cy="300" rx="260" ry="240" fill="none" stroke="#2bd6ff" stroke-opacity="0.12" stroke-width="1.5"/>
</svg>
